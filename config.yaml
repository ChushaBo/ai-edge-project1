# config.yaml — every tunable choice for the pipeline (see CLAUDE.md, rule 2).
#
# Values marked "# DECISION:" are made by people, not by code or Claude Code.
# Record each one in docs/decisions.md when you fill it in.
# `null` means "not decided yet". Scripts call utils.config.require(), which stops
# with an error if a value they need is still null.

# Where scripts read and write. Relative to the repo root. These are structural,
# not modeling decisions; data/ is gitignored.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: data/models
  figures: outputs/figures
  tables: outputs/tables
  data_dictionaries: docs/data_dictionaries

# Project scope (fixed by the project definition, not a tunable decision).
scope:
  state_abbr: FL
  state_fips: "12"

# Data source endpoints. Verified against the OpenFEMA catalog (DataSets) on 2026-11-15:
# "FIMA NFIP Redacted Claims v2" (FimaNfipClaims) no longer exists; the current dataset
# is NfipClaims v3 ("NFIP Redacted Claims").
sources:
  openfema_base: https://www.fema.gov/api/open
  claims_dataset: NfipClaims
  claims_version: 3
  policies_dataset: NfipPolicies   # "NFIP Redacted Policies", ~75M rows nationwide
  policies_version: 3
  # Bulk file used by 02 instead of API paging (the API times out on this dataset).
  policies_bulk_url: https://www.fema.gov/about/reports-and-data/openfema/v3/NfipPoliciesV3.parquet
  # Columns requested from the policies API ($select). The dataset is too large to pull
  # every column. Changing this list needs `02_download_policies.py --force`.
  policies_columns:
    # identifiers, geography, dates
    - id
    - propertyState
    - censusGeoid            # 12-digit block group; first 5 digits = county FIPS
    - reportedZipCode
    - reportedCity
    - latitude
    - longitude
    - nfipRatedCommunityNumber
    - nfipCommunityNumberCurrent
    - nfipCommunityName
    - asOfDate
    - policyEffectiveDate
    - policyTerminationDate
    - policyTermIndicator
    - cancellationDateOfFloodPolicy
    - cancellationVoidanceReasonCode
    - originalNBDate
    - policyCount
    # coverage, premium, fees
    - totalBuildingInsuranceCoverage
    - totalContentsInsuranceCoverage
    - totalInsurancePremiumOfThePolicy
    - policyCost
    - fullRiskPremium
    - federalPolicyFee
    - hfiaaSurcharge
    - reserveFundAssessment
    - iccPremium
    - communityProbationSurcharge
    - buildingDeductibleCode
    - contentsDeductibleCode
    - rateMethod
    # flood zone and elevation
    - ratedFloodZone
    - floodZoneCurrent
    - baseFloodElevation
    - lowestFloorElevation
    - lowestAdjacentGrade
    - elevationDifference
    - elevationCertificateIndicator
    - elevatedBuildingIndicator
    - postFIRMConstructionIndicator
    - preFIRMConstructionIndicator   # claims: preFirmIndicator
    - crsClassCode
    # building characteristics (same names as claims unless noted)
    - occupancyType
    - originalConstructionDate
    - numberOfFloorsInInsuredBuilding  # claims: numberOfFloorsInTheInsuredBuilding
    - basementEnclosureCrawlspaceType
    - foundationType
    - obstructionType
    - locationOfContents
    - buildingDescriptionCode
    - buildingPurpose
    - buildingReplacementCost
    - condominiumCoverageTypeCode
    - primaryResidenceIndicator
    - rentalPropertyIndicator
    - smallBusinessIndicatorBuilding
    - nonProfitIndicator
    - stateOwnedIndicator
    - agricultureStructureIndicator
    - houseOfWorshipIndicator         # claims: houseWorship
    - floodproofedIndicator
    - disasterAssistanceCoverageRequiredCode  # claims: disasterAssistanceCoverageRequired
  # NOAA NCEI Storm Events bulk CSVs (verified 2026-11-15). File names carry a creation
  # date (..._dYYYY_cYYYYMMDD.csv.gz), so 03 discovers them from the directory listing.
  storms_base_url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
  storms_state_name: FLORIDA   # STATE value in the details files
  # NWS zone-to-county correlation files (bpDDmmYY.dbx), discovered from this page.
  nws_zone_county_page: https://www.weather.gov/gis/ZoneCounty
  nws_zone_county_base: https://www.weather.gov/source/gis/Shapefiles/County/

years:
  claims_start: 2010     # DECISION: first year of loss to include (int); storms use the same range
  claims_end: 2024       # DECISION: last year of loss to include (int); exclude years with many open claims
  policies_year: 2025    # DECISION: policy terms with policyEffectiveDate in this year (int);
                         # one row per annual term, so each policy is counted once

# Time-based split on date of loss (CLAUDE.md, rule 4). Dates are inclusive, YYYY-MM-DD.
# train: loss date <= train_end
# validation: train_end < loss date <= validation_end
# test: validation_end < loss date (through years.claims_end)
splits:
  train_end: 2019-12-31  # DECISION: last date of loss in the training set
  validation_end: 2021-12-31  # DECISION: last date of loss in the validation set

target:
  definition: share_of_coverage  # DECISION: building payout / building coverage (RUNBOOK 2.1)
  drop_zero_paid: true   # DECISION: drop $0-paid claims from the severity model; log the count
  cpi_base_year: null    # not used: share_of_coverage needs no CPI adjustment
  drop_zero_coverage: true   # DECISION: drop claims with $0 building coverage (target undefined)
  cap_share_at: 1.0      # DECISION: cap payouts above coverage at 100% of coverage

# Exact field names, confirmed by a person against the saved data dictionaries
# (RUNBOOK 1.4). Do not guess these.
fields:
  claims_paid: netBuildingPaymentAmount        # DECISION: never missing; = amountPaidOnBuildingClaim minus recoveries
  claims_coverage: totalBuildingInsuranceCoverage  # DECISION
  claims_date_of_loss: dateOfLoss              # DECISION
  claims_county: countyCode                    # DECISION: 5-digit FIPS
  claims_flood_zone: ratedFloodZone            # DECISION: grouped per flood_zone_groups
  policies_premium: totalInsurancePremiumOfThePolicy  # DECISION: premium only, excludes fees and surcharges
  policies_premium_comparisons:                # DECISION: also reported in the shortfall table
    - policyCost         # premium + reserve fund + federal fee + HFIAA surcharge
    - fullRiskPremium    # FEMA's full-risk price
  policies_coverage: totalBuildingInsuranceCoverage  # DECISION
  policies_county: censusGeoid                 # DECISION: county FIPS = first 5 digits (no county field)
  policies_flood_zone: ratedFloodZone          # DECISION: grouped per flood_zone_groups
  # Claims feature names that differ in the policies data.
  policies_renamed:
    numberOfFloorsInTheInsuredBuilding: numberOfFloorsInInsuredBuilding
    houseWorship: houseOfWorshipIndicator
    preFirmIndicator: preFIRMConstructionIndicator
    disasterAssistanceCoverageRequired: disasterAssistanceCoverageRequiredCode

# The ONLY columns that may reach the model (CLAUDE.md, rule 3). Pre-event fields only,
# and present on the policies file so M1 can price 2025 policies (step 6.2).
# DECISION: "Core 20", signed off 2026-11-15 (docs/decisions.md, docs/field_review_1_4.md).
allowed_features:
  - ratedFloodZone                       # used as flood_zone_groups
  - totalBuildingInsuranceCoverage
  - totalContentsInsuranceCoverage
  - occupancyType                        # used as occupancy_groups
  - numberOfFloorsInTheInsuredBuilding
  - foundationType
  - elevatedBuildingIndicator
  - postFIRMConstructionIndicator
  - originalConstructionDate             # derive building age
  - originalNBDate                       # derive policy tenure
  - primaryResidenceIndicator
  - rentalPropertyIndicator
  - condominiumCoverageTypeCode
  - policyCount
  - crsClassCode
  - buildingDeductibleCode
  - basementEnclosureCrawlspaceType      # 54% missing on claims
  - elevationDifference                  # 58% missing on claims
  - latitude
  - longitude

# Month of loss is post-event: allowed in M2 only, never in M1.
month_of_loss_models: [M2]   # DECISION

# Groupings applied to claims and policies alike.
flood_zone_groups:           # DECISION: merges legacy numbered zones with modern ones
  V: [V, VE, V01, V02, V03, V04, V05, V06, V07, V08, V09, V10, V11, V12, V13, V14, V15, V16, V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28, V29, V30]
  A: [A, AE, A99, A01, A02, A03, A04, A05, A06, A07, A08, A09, A10, A11, A12, A13, A14, A15, A16, A17, A18, A19, A20, A21, A22, A23, A24, A25, A26, A27, A28, A29, A30]
  AH_AO: [AH, AHB, AO, AOB]
  X: [X, B, C]
  D: [D]
occupancy_groups:            # DECISION: consistent across legacy (1-6) and Risk Rating 2.0 (11-19) codes
  single_unit: [1, 11, 14, 16]
  two_to_four_units: [2, 12]
  five_plus_or_condo: [3, 13, 15]
  non_residential: [4, 6, 17, 18, 19]

cleaning:
  drop_exact_duplicate_claims: true   # DECISION: rows identical in every column except id/asOfDate
  exclude_cancelled_policies: true    # DECISION: drop terms with cancellationDateOfFloodPolicy from premium and exposure
  # Defaults set by Claude Code in step 2.2, for human review (not yet signed off):
  building_age_years: [0, 150]   # outside this range -> missing (bad construction dates)
  min_policy_tenure_years: 0     # negative tenure (policy start after loss) -> missing

# Columns 04_clean_claims derives from allowed features (name: source field).
# The leakage test treats these as allowed; month_of_loss is for M2 only.
derived_features:
  building_age_at_loss: originalConstructionDate
  policy_tenure_years: originalNBDate
  flood_zone_group: ratedFloodZone
  occupancy_group: occupancyType
  month_of_loss: dateOfLoss

# Claim-to-storm-event matching window around the date of loss, in days.
match_window:
  days_before: 3         # DECISION: days before date of loss (int)
  days_after: 3          # DECISION: days after date of loss (int)

# DECISION: list of NOAA EVENT_TYPE values to keep. Verify exact spellings against
# storms_fl.parquet (checked after step 1.3 on 2026-11-15).
# Claims set aside until a person revisits them. Rows stay in claims_with_text.parquet
# with quarantined = true; steps 06+ skip them while enabled (both M1 and M2, so the
# models are scored on the same claims). Set enabled: false to bring them back.
quarantine:
  enabled: true          # DECISION: temporary, 2026-11-15 (docs/decisions.md)
  rules:
    - name: helene_noaa_gap
      reason: "NOAA 2024 details file has no Hurricane Helene events for Tampa Bay counties; claims cannot be matched to a narrative"
      loss_date_from: 2024-09-24
      loss_date_to: 2024-09-30
      only_unmatched: true

storm_event_types:
  - Flood
  - Flash Flood
  - Coastal Flood
  - Storm Surge/Tide
  - Heavy Rain
  - Hurricane (Typhoon)   # NOAA spelling; plain "Hurricane" matches 0 rows
  - Tropical Storm

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2  # DECISION: sentence-transformers model name
  # Implementation settings (not decisions). The model reads at most 256 tokens, so
  # each narrative piece is split into chunks of <= chunk_words words before embedding.
  chunk_words: 150
  batch_size: 64

pca:
  n_components: 24       # DECISION: PCA dimensions for text embeddings (int); fit on train only

random_seed: 42          # DECISION: seed for numpy, sklearn, lightgbm, torch (int)
